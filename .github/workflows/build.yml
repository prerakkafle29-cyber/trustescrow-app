name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: false

      - name: Save google-services.json if it exists
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi

      - name: Generate Fresh V2 Android Scaffold Safely
        run: |
          flutter create temp_android_gen --platforms=android --org com.cyber --project-name trustescrow
          rm -rf android
          cp -r temp_android_gen/android ./android

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Enforce Android V2 Embedding in Manifest & Gradle
        run: |
          python3 -c "
          import json, re

          # 1. Read package name from google-services.json if present
          pkg_name = None
          try:
              with open('android/app/google-services.json', 'r') as f:
                  data = json.load(f)
                  pkg_name = data['client'][0]['client_info']['android_client_info']['package_name']
                  print(f'Detected Package Name: {pkg_name}')
          except Exception as e:
              print(f'No google-services.json package override: {e}')

          # 2. Configure app build.gradle
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          if pkg_name:
              content = re.sub(r'applicationId\s+[\"\'][^\"\']+[\"\']', f'applicationId \"{pkg_name}\"', content)
              content = re.sub(r'namespace\s+[\"\'][^\"\']+[\"\']', f'namespace \"{pkg_name}\"', content)

          if 'multiDexEnabled true' not in content:
              content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          if 'androidx.multidex:multidex' not in content:
              content = content.replace('dependencies {', 'dependencies {\n    implementation \'androidx.multidex:multidex:2.0.1\'')

          with open(gradle_path, 'w') as f:
              f.write(content)

          # 3. Explicitly set V2 Embedding meta-data in AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest = f.read()

          v2_meta = '<meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />'
          if 'flutterEmbedding' not in manifest:
              manifest = manifest.replace('<application', f'<application>\n        {v2_meta}\n    <meta-data-placeholder')
              manifest = manifest.replace('<meta-data-placeholder', '')

          if pkg_name:
              manifest = re.sub(r'package=\"[^\"]*\"', f'package=\"{pkg_name}\"', manifest)

          if 'androidx.multidex.MultiDexApplication' not in manifest:
              if 'android:name=' in manifest:
                  manifest = re.sub(r'android:name=\"[^\"]*\"', 'android:name=\"androidx.multidex.MultiDexApplication\"', manifest, count=1)
              else:
                  manifest = manifest.replace('<application', '<application android:name=\"androidx.multidex.MultiDexApplication\"')

          with open(manifest_path, 'w') as f:
              f.write(manifest)
          "

      - name: Clean & Fetch Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
