name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Generate Android Structure
        run: flutter create . --project-name trustescrow_app --platforms=android --org com.cyber.trustescrow

      - name: Force Enable Multidex in Gradle
        run: |
          # Inject multiDexEnabled into defaultConfig
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          content = content.replace('dependencies {', 'dependencies {\n    implementation \'androidx.multidex:multidex:2.0.1\'')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Add Firebase Dependencies
        run: |
          flutter pub add firebase_core:^2.27.0
          flutter pub add firebase_auth:^4.17.8

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
