name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: false

      - name: Save google-services.json if it exists
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi

      - name: Generate fresh Android Scaffold safely
        run: |
          flutter create temp_android_gen --platforms=android --org com.cyber.trustescrow --project-name trustescrow_app
          rm -rf android
          cp -r temp_android_gen/android ./android

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Deep Clean Cache & Get Dependencies
        run: |
          flutter clean
          flutter pub cache clean -f
          rm -f pubspec.lock
          flutter pub get

      - name: Configure Gradle, Multidex & Google Services
        run: |
          python3 -c "
          # 1. Ensure buildscript classpath is added to root android/build.gradle
          root_gradle = 'android/build.gradle'
          with open(root_gradle, 'r') as f:
              r_content = f.read()
          if 'com.google.gms:google-services' not in r_content:
              if 'buildscript {' in r_content:
                  r_content = r_content.replace('dependencies {', 'dependencies {\n        classpath \"com.google.gms:google-services:4.4.1\"', 1)
              else:
                  buildscript_code = 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath \"com.google.gms:google-services:4.4.1\"\n    }\n}\n\n'
                  r_content = buildscript_code + r_content
              with open(root_gradle, 'w') as f:
                  f.write(r_content)

          # 2. Add multiDex, dependency, and apply google-services plugin to app-level build.gradle
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()
          
          if 'multiDexEnabled true' not in content:
              content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          if 'androidx.multidex:multidex' not in content:
              content = content.replace('dependencies {', 'dependencies {\n    implementation \'androidx.multidex:multidex:2.0.1\'')
          
          if 'com.google.gms.google-services' not in content:
              content += '\napply plugin: \"com.google.gms.google-services\"\n'

          with open(gradle_path, 'w') as f:
              f.write(content)

          # 3. Add MultiDexApplication to AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest = f.read()
          
          if 'androidx.multidex.MultiDexApplication' not in manifest:
              import re
              if 'android:name=' in manifest:
                  manifest = re.sub(r'android:name=\"[^\"]*\"', 'android:name=\"androidx.multidex.MultiDexApplication\"', manifest, count=1)
              else:
                  manifest = manifest.replace('<application', '<application android:name=\"androidx.multidex.MultiDexApplication\"')
              
              with open(manifest_path, 'w') as f:
                  f.write(manifest)
          "

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
