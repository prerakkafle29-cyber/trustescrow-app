name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Save google-services.json if exists
        run: |
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi

      - name: Save pubspec files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          if [ -f "pubspec.lock" ]; then cp pubspec.lock /tmp/pubspec.lock; fi

      - name: Generate Android Scaffold
        run: flutter create . --project-name trustescrow_app --platforms=android --org com.cyber.trustescrow

      - name: Restore original pubspec & google-services
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          if [ -f "/tmp/pubspec.lock" ]; then cp /tmp/pubspec.lock pubspec.lock; fi
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Multidex & Manifest
        run: |
          python3 -c "
          # 1. Add multiDexEnabled and dependency to build.gradle
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()
          if 'multiDexEnabled true' not in content:
              content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          if 'androidx.multidex:multidex' not in content:
              content = content.replace('dependencies {', 'dependencies {\n    implementation \'androidx.multidex:multidex:2.0.1\'')
          with open(gradle_path, 'w') as f:
              f.write(content)

          # 2. Add MultiDexApplication to AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest = f.read()
          
          if 'androidx.multidex.MultiDexApplication' not in manifest:
              import re
              if 'android:name=' in manifest:
                  manifest = re.sub(r'android:name=\"[^\"]*\"', 'android:name=\"androidx.multidex.MultiDexApplication\"', manifest, count=1)
              else:
                  manifest = manifest.replace('<application', '<application android:name=\"androidx.multidex.MultiDexApplication\"')
              
              with open(manifest_path, 'w') as f:
                  f.write(manifest)
          "

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
