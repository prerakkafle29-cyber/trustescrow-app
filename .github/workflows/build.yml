name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Generate Android Structure
        run: flutter create . --project-name trustescrow_app --platforms=android --org com.cyber.trustescrow

      - name: Enable Multidex in Gradle
        run: |
          sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation "com.android.support:multidex:1.0.3"/' android/app/build.gradle

      - name: Add Firebase Dependencies
        run: |
          flutter pub add firebase_core:^2.27.0
          flutter pub add firebase_auth:^4.17.8

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
