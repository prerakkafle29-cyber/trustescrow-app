name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Backup custom files
      run: |
        mkdir -p /tmp/backup
        cp pubspec.yaml /tmp/backup/ 2>/dev/null || true
        cp -r lib /tmp/backup/ 2>/dev/null || true
        cp google-services.json /tmp/backup/ 2>/dev/null || true

    - name: Generate Android Skeleton
      run: |
        flutter create . --org com.trustescrow --project-name trustescrow --platforms=android --force

    - name: Restore custom files
      run: |
        cp /tmp/backup/pubspec.yaml ./pubspec.yaml 2>/dev/null || true
        rm -rf ./lib/*
        cp -r /tmp/backup/lib/* ./lib/ 2>/dev/null || true
        mkdir -p android/app
        if [ -f /tmp/backup/google-services.json ]; then
          cp /tmp/backup/google-services.json android/app/google-services.json
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
