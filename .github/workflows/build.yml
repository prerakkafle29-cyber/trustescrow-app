name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Generate Clean Android Structure
        run: flutter create . --project-name trustescrow_app --platforms=android --org com.cyber.trustescrow

      - name: Safely Configure Gradle & Manifest
        run: |
          python3 -c "
          # 1. Add multiDexEnabled to build.gradle safely
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()
          if 'multiDexEnabled true' not in content:
              content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
          if 'androidx.multidex:multidex' not in content:
              content = content.replace('dependencies {', 'dependencies {\n    implementation \'androidx.multidex:multidex:2.0.1\'')
          with open(gradle_path, 'w') as f:
              f.write(content)

          # 2. Safely add android:name to AndroidManifest.xml without breaking XML
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest = f.read()
          
          if 'android:name=\"androidx.multidex.MultiDexApplication\"' not in manifest:
              if 'android:name=' in manifest:
                  # Replace existing android:name value safely
                  import re
                  manifest = re.sub(r'android:name=\"[^\"]*\"', 'android:name=\"androidx.multidex.MultiDexApplication\"', manifest, count=1)
              else:
                  manifest = manifest.replace('<application', '<application android:name=\"androidx.multidex.MultiDexApplication\"')
              
              with open(manifest_path, 'w') as f:
                  f.write(manifest)
          "

      - name: Add Firebase Dependencies
        run: |
          flutter pub add firebase_core:^2.27.0
          flutter pub add firebase_auth:^4.17.8

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
